services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: srms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: school-system
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test -u admin -p password --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srms-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: srms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srms-network

  # Backend Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srms-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: npm run dev
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://admin:password@mongodb:27017/school-system?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PORT: 5000
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - srms-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  srms-network:
    driver: bridge
