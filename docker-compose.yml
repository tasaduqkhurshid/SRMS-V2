services:
  mongodb:
    profiles: [docker]
    image: mongo:7.0
    restart: unless-stopped
    command:
      - bash
      - -lc
      - |
        # Start mongod without auth first
        if [[ -z "$$MONGO_APP_USERNAME" || -z "$$MONGO_APP_PASSWORD" ]]; then
          echo "DB_USERNAME and DB_PASSWORD (or MONGO_ROOT_USER and MONGO_ROOT_PASSWORD) are required for the Docker MongoDB profile." >&2
          exit 1
        fi
        /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --noauth &
        MONGOD_PID=$!
        
        # Wait for mongod to start
        sleep 10
        
        # Initialize replica set and create the same configurable account used by the API
        MONGO_APP_USERNAME_B64="$$(printf '%s' "$$MONGO_APP_USERNAME" | base64 | tr -d '\n')"
        MONGO_APP_PASSWORD_B64="$$(printf '%s' "$$MONGO_APP_PASSWORD" | base64 | tr -d '\n')"
        MONGO_APP_AUTH_SOURCE_B64="$$(printf '%s' "$$MONGO_APP_AUTH_SOURCE" | base64 | tr -d '\n')"
        mongosh --quiet --eval "
          try { rs.status() } catch { 
            rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]});
          }
          let primaryReady = false;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try { if (db.hello().isWritablePrimary) { primaryReady = true; break; } } catch (e) {}
            sleep(1000);
          }
          if (!primaryReady) quit(1);
          const appUsername = Buffer.from('$${MONGO_APP_USERNAME_B64}', 'base64').toString('utf8');
          const appPassword = Buffer.from('$${MONGO_APP_PASSWORD_B64}', 'base64').toString('utf8');
          const authSource = Buffer.from('$${MONGO_APP_AUTH_SOURCE_B64}', 'base64').toString('utf8');
          db = db.getSiblingDB(authSource);
          const appRoles = [{role: \"root\", db: \"admin\"}];
          if (db.getUser(appUsername)) {
            db.updateUser(appUsername, {pwd: appPassword, roles: appRoles});
          } else {
            db.createUser({user: appUsername, pwd: appPassword, roles: appRoles});
          }
        "
        
        # Restart with auth
        kill $$MONGOD_PID
        wait $$MONGOD_PID 2>/dev/null || true
        
        # Replica-set members require a shared keyfile when authorization is enabled.
        KEYFILE=/data/configdb/replica.key
        if [[ ! -s "$$KEYFILE" ]]; then
          umask 077
          openssl rand -base64 756 > "$$KEYFILE"
          chown mongodb:mongodb "$$KEYFILE"
          chmod 400 "$$KEYFILE"
        fi
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile "$$KEYFILE"
    environment:
      MONGO_APP_USERNAME: ${DB_USERNAME:-${MONGO_ROOT_USER:-srms_admin}}
      MONGO_APP_PASSWORD: ${DB_PASSWORD:-${MONGO_ROOT_PASSWORD:-}}
      MONGO_APP_AUTH_SOURCE: ${DB_AUTH_SOURCE:-admin}
      MONGO_INITDB_DATABASE: ${DB_NAME:-school-system}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_APP_USERNAME\" --password \"$$MONGO_APP_PASSWORD\" --authenticationDatabase \"$$MONGO_APP_AUTH_SOURCE\" --eval 'const s=rs.status(); if (db.adminCommand(\"ping\").ok !== 1 || s.ok !== 1 || !db.hello().isWritablePrimary) quit(1)' "]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [srms-internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [srms-internal]

  sms-api:
    build:
      context: ./srmsapi
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "node -e 'require(\"./src/config/jwt\").validateRuntimeConfig()' && npm run migrate && npm run seed && npm start"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_DEBUG: ${MONGO_DEBUG:-false}
      PORT: 5000
      DB_TYPE: ${DB_TYPE:-docker}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-27017}
      DB_NAME: ${DB_NAME:-school-system}
      DB_USERNAME: ${DB_USERNAME:-${MONGO_ROOT_USER:-srms_admin}}
      DB_PASSWORD: ${DB_PASSWORD:-${MONGO_ROOT_PASSWORD:-}}
      DB_AUTH_SOURCE: ${DB_AUTH_SOURCE:-admin}
      DB_REPLICA_SET: ${DB_REPLICA_SET-rs0}
      DB_DIRECT_CONNECTION: ${DB_DIRECT_CONNECTION:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-platform-admin@sms.local}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      DEBUG_ERRORS: ${DEBUG_ERRORS:-false}
      PAYMENT_CREDENTIALS_ENCRYPTION_KEY: ${PAYMENT_CREDENTIALS_ENCRYPTION_KEY:-}
      SMS_API_IN_DOCKER: "true"
      ROOT_DOMAIN: ${ROOT_DOMAIN:-sms.local}
      JWT_SECRET: ${JWT_SECRET:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      HANFIA_ADMIN_PASSWORD: ${HANFIA_ADMIN_PASSWORD:-}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      SCHOOLB_ADMIN_PASSWORD: ${SCHOOLB_ADMIN_PASSWORD:-}
      SCHOOLB_STUDENT_PASSWORD: ${SCHOOLB_STUDENT_PASSWORD:-}
      HIT_ADMIN_PASSWORD: ${HIT_ADMIN_PASSWORD:-}
      HIT_ADMIN_PIN: ${HIT_ADMIN_PIN:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-}
      R2_PUBLIC_BUCKET_NAME: ${R2_PUBLIC_BUCKET_NAME:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      TRUST_PROXY: "1"
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-}
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [srms-internal]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local development counterparts share the production network and data volumes.
  # They use distinct service names so selecting local mode never mutates production
  # containers that may already be running.
  sms-api-local:
    profiles: [local]
    build:
      context: ./srmsapi
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 5000
      DB_TYPE: ${DB_TYPE:-local}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-27017}
      DB_NAME: ${DB_NAME:-school-system}
      DB_USERNAME: ${DB_USERNAME:-srms_admin}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_AUTH_SOURCE: ${DB_AUTH_SOURCE:-school-system}
      DB_REPLICA_SET: ${DB_REPLICA_SET:-}
      DB_DIRECT_CONNECTION: ${DB_DIRECT_CONNECTION:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      HANFIA_ADMIN_PASSWORD: ${HANFIA_ADMIN_PASSWORD:-}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      SCHOOLB_ADMIN_PASSWORD: ${SCHOOLB_ADMIN_PASSWORD:-}
      SCHOOLB_STUDENT_PASSWORD: ${SCHOOLB_STUDENT_PASSWORD:-}
      HIT_ADMIN_PASSWORD: ${HIT_ADMIN_PASSWORD:-}
      HIT_ADMIN_PIN: ${HIT_ADMIN_PIN:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-platform-admin@sms.local}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      DEBUG_ERRORS: ${DEBUG_ERRORS:-false}
      SMS_API_IN_DOCKER: "true"
      ROOT_DOMAIN: ${ROOT_DOMAIN:-sms.local}
      JWT_SECRET: ${JWT_SECRET:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PAYMENT_CREDENTIALS_ENCRYPTION_KEY: ${PAYMENT_CREDENTIALS_ENCRYPTION_KEY:-}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-}
      R2_PUBLIC_BUCKET_NAME: ${R2_PUBLIC_BUCKET_NAME:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      TRUST_PROXY: "1"
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-}
    volumes:
      - ./srmsapi:/app
      - api_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [srms-internal]

  sms-school:
    build:
      context: ./srms-school
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [srms-internal]

  sms-school-local:
    profiles: [local]
    build:
      context: ./srms-school
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      ROOT_DOMAIN: ${ROOT_DOMAIN:-sms.local}
      VITE_API_PROXY_TARGET: http://${NGINX_API_UPSTREAM}
      CHOKIDAR_USEPOLLING: ${VITE_USE_POLLING:-true}
    volumes:
      - ./srms-school/client:/app/client
      - school_node_modules:/app/client/node_modules
    depends_on:
      sms-api-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/admin/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [srms-internal]

  sms-student:
    build:
      context: ./srms-student
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [srms-internal]

  sms-student-local:
    profiles: [local]
    build:
      context: ./srms-student
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      ROOT_DOMAIN: ${ROOT_DOMAIN:-sms.local}
      VITE_API_PROXY_TARGET: http://${NGINX_API_UPSTREAM}
      CHOKIDAR_USEPOLLING: ${VITE_USE_POLLING:-true}
    volumes:
      - ./srms-student:/app
      - student_node_modules:/app/node_modules
    depends_on:
      sms-api-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [srms-internal]

  sms-admin:
    build:
      context: ./srms-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [srms-internal]

  sms-admin-local:
    profiles: [local]
    build:
      context: ./srms-admin
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      ROOT_DOMAIN: ${ROOT_DOMAIN:-sms.local}
      VITE_API_PROXY_TARGET: http://${NGINX_API_UPSTREAM}
      CHOKIDAR_USEPOLLING: ${VITE_USE_POLLING:-true}
    volumes:
      - ./srms-admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      sms-api-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [srms-internal]

  sms-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:-sms.local}
      NGINX_LISTEN_PORT: 80
      NGINX_SCHOOL_UPSTREAM: ${NGINX_SCHOOL_UPSTREAM:?Set NGINX_SCHOOL_UPSTREAM in the selected environment file}
      NGINX_SCHOOL_STRIP_PREFIX: ${NGINX_SCHOOL_STRIP_PREFIX:?Set NGINX_SCHOOL_STRIP_PREFIX in the selected environment file}
      NGINX_STUDENT_UPSTREAM: ${NGINX_STUDENT_UPSTREAM:?Set NGINX_STUDENT_UPSTREAM in the selected environment file}
      NGINX_ADMIN_UPSTREAM: ${NGINX_ADMIN_UPSTREAM:?Set NGINX_ADMIN_UPSTREAM in the selected environment file}
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:?Set NGINX_API_UPSTREAM in the selected environment file}
      NGINX_ENVSUBST_FILTER: '^(ROOT_DOMAIN|NGINX_LISTEN_PORT|NGINX_SCHOOL_UPSTREAM|NGINX_SCHOOL_STRIP_PREFIX|NGINX_STUDENT_UPSTREAM|NGINX_ADMIN_UPSTREAM|NGINX_API_UPSTREAM)$'
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/proxy_params:/etc/nginx/proxy_params:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [srms-internal]

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  api_node_modules:
  school_node_modules:
  student_node_modules:
  admin_node_modules:

networks:
  srms-internal:
    driver: bridge
