version: '3.9'

services:
  # Frontend Client
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srms-client
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      NODE_ENV: production
    networks:
      - srms-network

volumes: {}

networks:
  srms-network:
    driver: bridge
