# Docker Compose Development Override
# This file extends the base docker-compose.yml for development with hot reload
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  # MongoDB and Redis remain unchanged (use base config)

  # API Development Server with Nodemon
  sms-api:
    build:
      context: ./srmsapi
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      MONGO_DEBUG: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./srmsapi/server:/app/server
      - /app/server/node_modules
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # School Portal Development Server (Vite)
  sms-school:
    build:
      context: ./srms-school
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: "http://sms-api:5000"
    volumes:
      - ./srms-school/client:/app/client
      - /app/client/node_modules
    ports:
      - "5173:5173"
    depends_on:
      sms-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/admin/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Admin Portal Development Server (Vite)
  sms-admin:
    build:
      context: ./srms-admin
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: "http://sms-api:5000"
    volumes:
      - ./srms-admin:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      sms-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5174/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Student Portal Development Server (Vite)
  sms-student:
    build:
      context: ./srms-student
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "web", "--", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: "http://sms-api:5000"
    volumes:
      - ./srms-student:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    depends_on:
      sms-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nginx Reverse Proxy for Development (optional - routes to dev servers)
  sms-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:-sms.local}
      NGINX_LISTEN_PORT: 80
      NGINX_ENVSUBST_FILTER: '^(ROOT_DOMAIN|NGINX_LISTEN_PORT)$'
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      sms-school:
        condition: service_healthy
      sms-student:
        condition: service_healthy
      sms-admin:
        condition: service_healthy
      sms-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5